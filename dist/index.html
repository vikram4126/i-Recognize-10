, clear, and concise story, driving and inspiring meaningful action.`,color:`text-[#FD349C]`,bg:`bg-[#FD349C]/10`},{title:`Motion Flow`,icon:`Move`,text:`Recognizes projects where motion and transitions were used purposefully to elevate the user experience effortlessly.`,color:`text-[#7213EA]`,bg:`bg-[#7213EA]/10`},{title:`Creative Spark`,icon:`Sparkles`,text:`Acknowledges new ideas and fresh approaches - where curiosity, clarity, and intent sparked meaningful innovation.`,color:`text-[#50E3C2]`,bg:`bg-[#50E3C2]/10`},{title:`Result Momentum`,icon:`TrendingUp`,text:`Recognizes a body of work with measurable impact - built through steady and consistent effort over time.`,color:`text-[#4A90E2]`,bg:`bg-[#4A90E2]/10`},{title:`Story Clarity`,icon:`BookOpen`,text:`Recognizes work that connected with clarity and emotional resonance. Impactful stories that convey complex ideas engage easily.`,color:`text-[#E84B1E]`,bg:`bg-[#E84B1E]/10`},{title:`Collective Choice`,icon:`Users`,text:`Recognizes work that connected across teams, fostering strong collaboration and collective success across diverse organizational functions.`,color:`text-[#ACEAFF]`,bg:`bg-[#ACEAFF]/10`}]},team:{badge:`People Power`,title:`Core Team Members`,description:`The people driving the rhythm and momentum of i-Recognize`,members:[{name:`Aditya`,role:`Lead Architect`,img:`https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=150`},{name:`Priyanka`,role:`UX Director`,img:`https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=150`},{name:`Rajesh`,role:`Strategy Head`,img:`https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&q=80&w=150`},{name:`Neha`,role:`Digital Lead`,img:`https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=150`},{name:`Siddharth`,role:`Creative Lead`,img:`https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=150`},{name:`Ananya`,role:`Ops Manager`,img:`https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=150`},{name:`Manish`,role:`Tech Lead`,img:`https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=150`},{name:`Ritu`,role:`Engagement Lead`,img:`https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150`}]},journey:{badge:`THE PROCESS`,title:`Roadmap to Recognition`,steps:[{id:1,title:`Nomination`,day:`April 10rd`,desc:`Official start for submitting entries through the platform portal.`},{id:2,title:`Review`,day:`April 15th`,desc:`Initial screening by the core committee for adherence to category criteria.`},{id:3,title:`Shortlist`,day:`April 18th`,desc:`Identification of the top 3 contenders in each award category.`},{id:4,title:`Showcase`,day:`April 20th`,desc:`Platform opens for the wider teams to view and learn from the shortlisted work.`},{id:5,title:`Final Jury`,day:`April 22nd`,desc:`Exclusive presentation to the global jury for final winner selection.`},{id:6,title:`Gala Night`,day:`April 23rd`,desc:`Grand celebration and live announcement of the i-Recognize 2026 winners.`},{id:7,title:`Legacy`,day:`Annual Event`,desc:`Continuous archival of recognized stories in the platform's hall of fame.`}]},theme:{badge:`THE THEME 2026`,title:`The Hummingbird: Resilience & Agility`,titlePrefix:`THE`,titleMain:`HUMMINGBIRD`,description:`The hummingbird represents focus and consistency - a reminder that impactful work is driven by precision and sustained effort. Small actions, repeated with intentional focus, create ripples of change. This spirit defines the core of i-Recognize 2026.`,hummingBirdUrl:`./assets/humming-bird.svg`,cta:`Learn More About Theme`},support:{badge:`People Behind the Process`,title:`Jury & SPOC Support`,juryTitle:`The Jury`,spocTitle:`SPOC Support`,juryMembers:[{name:`Amitabh`,role:`Partner`,img:`https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&
